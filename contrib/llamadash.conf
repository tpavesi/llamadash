# Settings for llamadash, read from /etc/llamadash.conf at every start
# (by the boot service and by anyone running llamadash by hand).
# Lines are NAME=value. A flag on the command line or a variable in the
# environment overrides the line here.
# If the screen stays blank after boot, see "Run at boot on the console" in the README.
# The service must be restarted after a change: systemctl restart llamadash

# Address of the llama-server.
LLAMADASH_URL=http://localhost:8080

# Price of one kWh, in the currency below (here 30p per kWh). Remove the two
# lines to show no cost figures.
LLAMADASH_KWH_PRICE=0.30

# Three-letter currency code of that price.
LLAMADASH_CURRENCY=GBP

# Maximum wattage of this machine's power supply: the top of the power chart.
#LLAMADASH_PSU_WATTS=1000

# Show the dashboard's worst colour on the motherboard lighting (needs OpenRGB).
#LLAMADASH_LED=on
# Path of the openrgb program when it is not on PATH.
#LLAMADASH_LED_CMD=/opt/openrgb/openrgb
# Drive this device instead of every motherboard OpenRGB finds.
#LLAMADASH_LED_DEVICE=

# Lines named LLAMADASH_AXIS_* are chart scales that llamadash maintains itself;
# delete one to reset that chart's scale.
# LLAMADASH_KNOWN_FANS lists the fans llamadash has seen spinning, so a stopped
# or missing one is flagged at once after a restart; delete an entry to forget a fan.
